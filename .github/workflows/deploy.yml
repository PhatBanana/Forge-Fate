name: Deploy to GitHub Pages

# Every push to main publishes, and the workflow can be run by hand from the
# Actions tab when you want to redeploy without a commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages authenticates with OIDC rather than a stored token.
  id-token: write

# A queued deploy waits for the running one rather than cancelling it, so a
# quick succession of pushes still ends with the newest commit live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lint, types and tests all gate the deploy. A build that fails its tests
      # is not one to publish, and catching it here beats catching it live.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
